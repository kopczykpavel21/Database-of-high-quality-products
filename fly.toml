app = "database-of-high-quality-products"
primary_region = "ams"

[build]

[env]
  APP_ENV            = "production"
  DB_PATH            = "/data/products.db"
  SNAPSHOTS_DB_PATH  = "/data/snapshots.db"
  USERS_DB_PATH      = "/data/users.db"
  # Fly's FUSE volume doesn't support WAL extra files — use DELETE journal mode
  JOURNAL_MODE       = "delete"
  # HTML cache TTL in seconds (5 min default)
  HTML_TTL           = "300"
  PORT               = "8080"
  # Show Python output in fly logs immediately (no line-buffering delay)
  PYTHONUNBUFFERED   = "1"
  # The real scraping pipeline is the local Mac launchd daemon + manual
  # deploy_to_fly.sh upload. The in-server scheduler rarely survives long
  # enough to finish (auto_stop_machines kills it mid-run) and drove
  # unnecessary billed vCPU/memory. Set to "true" to re-enable if this
  # ever becomes the primary pipeline again.
  AUTO_START_SCHEDULER = "false"

# Secrets set via: fly secrets set SCRAPER_KEY=<key> OTP_PEPPER=<random> \
#   GOOGLE_CLIENT_ID=<id> SMTP_HOST=<host> SMTP_USER=<user> SMTP_PASS=<password>
# (never put real secrets in fly.toml — use fly secrets)

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  memory   = "2gb"
  cpu_kind = "shared"
  cpus     = 1

[[mounts]]
  source           = "qualitydb_data"
  destination      = "/data"
  initial_size     = "5gb"
